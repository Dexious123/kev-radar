[theme]
base = "dark"
primaryColor = "#e0a33a"
backgroundColor = "#0b1117"
secondaryBackgroundColor = "#141c26"
textColor = "#e7eef6"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
fileWatcherType = "none"
# Uploads are parsed row by row on a shared server; 10 MB is a large Tenable export.
maxUploadSize = 10
